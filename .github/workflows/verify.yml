name: Verify

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v5.0.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.0
      - name: Verify wrapper
        run: ./gradlew --version
      - name: Unit tests
        id: unit_tests
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest --no-daemon --console=plain --stacktrace 2>&1 | tee unit-tests.log
      # Failure triage without opening the raw log: the error excerpt lands in the run
      # summary AND as a check annotation (visible via the Checks API). The job still
      # fails because the Unit tests step above failed.
      - name: Report unit-test failure cause
        if: failure() && steps.unit_tests.conclusion == 'failure'
        run: python3 .github/workflows/report_failure.py unit-tests.log "Unit-test"
      - name: Lint
        id: lint
        run: |
          set -o pipefail
          ./gradlew :app:lintDebug --no-daemon --console=plain --stacktrace 2>&1 | tee lint.log
      - name: Report lint failure cause
        if: failure() && steps.lint.conclusion == 'failure'
        run: python3 .github/workflows/report_failure.py lint.log "Lint"
      - name: Debug build
        id: debug_build
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --no-daemon --console=plain --stacktrace 2>&1 | tee build.log
      - name: Report build failure cause
        if: failure() && steps.debug_build.conclusion == 'failure'
        run: python3 .github/workflows/report_failure.py build.log "Debug-build"

  instrumented-smoke:
    name: Instrumented smoke (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api-level: [29, 35]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v5.0.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.0

      - name: Run instrumented tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          # bash wrapper: the script shell is sh (no pipefail) with errexit, so run
          # Gradle under bash for a truthful exit code, capture it via || (which
          # is exempt from errexit), then triage failures into annotations.
          script: |-
            code=0
            bash -o pipefail -c './gradlew :app:connectedDebugAndroidTest --no-daemon --console=plain --stacktrace 2>&1 | tee connected.log' || code=$?
            if [ "$code" -ne 0 ]; then
              python3 .github/workflows/report_failure.py connected.log "Smoke(API ${{ matrix.api-level }})"
            fi
            exit $code
