name: Verify

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v5.0.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v4.4.0
      - name: Verify wrapper
        run: ./gradlew --version
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --console=plain
      - name: Lint
        run: ./gradlew :app:lintDebug --no-daemon --console=plain
      - name: Debug build
        run: ./gradlew :app:assembleDebug --no-daemon --console=plain

  instrumented-smoke:
    name: Instrumented smoke (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api-level: [29, 35]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v5.0.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v4.4.0
      - name: Install Android emulator image
        env:
          API_LEVEL: ${{ matrix.api-level }}
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "emulator" "platforms;android-${API_LEVEL}" "system-images;android-${API_LEVEL};google_apis;x86_64"
          echo "no" | avdmanager create avd --force --name "qa-api-${API_LEVEL}" --package "system-images;android-${API_LEVEL};google_apis;x86_64" --device "pixel_2"
      - name: Boot emulator
        env:
          API_LEVEL: ${{ matrix.api-level }}
        run: |
          nohup emulator -avd "qa-api-${API_LEVEL}" -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect > emulator.log 2>&1 &
          adb wait-for-device
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          timeout 180s adb shell getprop sys.boot_completed | grep -m 1 "1"
      - name: Instrumented smoke tests
        run: ./gradlew :app:connectedDebugAndroidTest --no-daemon --console=plain
