org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# Configuration cache is off on purpose: it adds little here and can surprise first-time builds.
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true
# AGP 8.7.3 officially supports compileSdk up to 35, but dependencies (media3 1.11, …)
# require 36, so the project compiles against 36 with this explicit opt-out.
# Revisit after upgrading to AGP 8.9+ (or 9.x together with compileSdk 37).
android.suppressUnsupportedCompileSdk=36

kotlin.code.style=official
