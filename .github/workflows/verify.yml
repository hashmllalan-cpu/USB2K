name: Verify

on:
  pull_request:
  push:
    # main: the merge gate. arena/**: the working branches this repo is developed on.
    # Without the arena/** trigger a pushed branch runs *no* CI at all, so a red
    # instrumented-smoke job could only ever be diagnosed by opening a PR first.
    branches: [ main, "arena/**" ]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v5.0.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Verify wrapper
        run: ./gradlew --version
      - name: Unit tests
        id: unit_tests
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest --no-daemon --console=plain --stacktrace 2>&1 | tee unit-tests.log
      # Failure triage without opening the raw log: the error excerpt lands in the run
      # summary AND as a check annotation (visible via the Checks API). The job still
      # fails because the Unit tests step above failed.
      - name: Report unit-test failure cause
        if: failure() && steps.unit_tests.conclusion == 'failure'
        run: python3 .github/workflows/report_failure.py unit-tests.log "Unit-test"
      - name: Lint
        id: lint
        run: |
          set -o pipefail
          ./gradlew :app:lintDebug --no-daemon --console=plain --stacktrace 2>&1 | tee lint.log
      - name: Report lint failure cause
        if: failure() && steps.lint.conclusion == 'failure'
        run: python3 .github/workflows/report_failure.py lint.log "Lint"
      - name: Debug build
        id: debug_build
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --no-daemon --console=plain --stacktrace 2>&1 | tee build.log
      - name: Report build failure cause
        if: failure() && steps.debug_build.conclusion == 'failure'
        run: python3 .github/workflows/report_failure.py build.log "Debug-build"

  instrumented-smoke:
    name: Instrumented smoke (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api-level: [29, 35]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v5.0.0
        with:
          distribution: temurin
          java-version: "17"
      # Same pin as build-apk.yml (VRF-02): one SHA per action across the repo, and the
      # comment must name the release that SHA actually is. Proven green on the `verify`
      # job by run 34373598827 (dependabot PR #15).
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Run instrumented tests on emulator
        # Pinned to the commit behind the `v2` tag (= release v2.38.0) instead of the
        # floating tag, matching the SHA-pinning policy of every other action (VRF-01).
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2 (release v2.38.0)
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          # bash wrapper: the script shell is sh (no pipefail) with errexit, so run
          # Gradle under bash for a truthful exit code, capture it via || (which
          # is exempt from errexit), then triage the failure. The evidence script dumps
          # the device state (logcat, install/instrumentation state) and annotates the
          # run — while the emulator is still alive, which is the only moment that data
          # exists. It must never change the exit code, so `|| true`.
          script: |-
            code=0
            bash -o pipefail -c './gradlew :app:connectedDebugAndroidTest --no-daemon --console=plain --stacktrace 2>&1 | tee connected.log' || code=$?
            if [ "$code" -ne 0 ]; then
              sh .github/workflows/smoke_evidence.sh smoke-evidence "Smoke(API ${{ matrix.api-level }})" connected.log || true
            fi
            exit $code

      # The raw job log sits on a host a sandboxed reviewer cannot reach, and the Gradle
      # error only says "There were failing tests". This artifact is what makes an
      # emulator failure diagnosable afterwards: device logcat + crash buffer + install
      # and instrumentation state + the connected-test reports.
      - name: Upload smoke failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.0
        with:
          name: smoke-api-${{ matrix.api-level }}-evidence
          path: |
            connected.log
            smoke-evidence/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: warn
          retention-days: 14
