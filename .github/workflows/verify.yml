name: Verify

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v5.0.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v4.4.0
      - name: Verify wrapper
        run: ./gradlew --version
      - name: Unit tests
        id: unit_tests
        continue-on-error: true
        run: ./gradlew :app:testDebugUnitTest --no-daemon --console=plain

      - name: Report and fail on unit test errors
        if: steps.unit_tests.outcome == 'failure'
        run: |
          echo "::group::Test Results XML"
          for f in $(find app/build/test-results/testDebugUnitTest -name "*.xml" 2>/dev/null); do
            if grep -q "<failure" "$f"; then
              echo "=== Test Failure Details in $f ==="
              cat "$f"
            fi
          done
          echo "::endgroup::"
          echo "::error::Unit tests failed. See details above."
          exit 1

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.0
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

      - name: Lint
        run: ./gradlew :app:lintDebug --no-daemon --console=plain
      - name: Debug build
        run: ./gradlew :app:assembleDebug --no-daemon --console=plain

  instrumented-smoke:
    name: Instrumented smoke (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api-level: [29, 35]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v5.0.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v4.4.0

      - name: Run instrumented tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: ./gradlew :app:connectedDebugAndroidTest --no-daemon --console=plain
