name: Build APK
# إصدار APK موقّع من tags أو تشغيل يدوي فقط
# يبني ملف APK جاهزًا للتثبيت على أي push أو يدويًا من تبويب Actions.
# التوقيع: يفضّل الأسرار USBMEDIA_KEYSTORE_B64 + كلمات المرور (يحوّلها إلى keystore/ci.p12)،
# يفشل البناء عند غياب الأسرار؛ لا يوجد مفتاح احتياطي داخل المستودع
# (تدوير المفتاح المسرّب). كل الخطوات مثبّتة بـSHA الكامل لا بوسوم متحركة (تدقيق CI).
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      run_tests:
        description: 'تشغيل اختبارات الوحدات أيضًا'
        type: boolean
        default: true

# لا تملك وظيفة الإصدار صلاحيات كتابة إلا بعد اجتياز كل بوابات البناء والاختبار.
permissions:
  contents: read

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: build + test + lint + publish
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write # release jobs only; pull requests never reach this job

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.0.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4.4.0
        with:
          gradle-version: '8.9'

      - name: Show environment
        run: |
          java -version
          ./gradlew --version
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" 2>/dev/null || true

      # إن وُجد السر USBMEDIA_KEYSTORE_B64 يُكتب المفتاح الحقيقي (المُداوَر) إلى
      # keystore/ci.p12 — وهو ملف متجاهَل في .gitignore ولا يعود أبدًا إلى المستودع.
      # غياب السر يفشل المهمة؛ لا يوجد مفتاح احتياطي داخل المستودع.
      - name: Materialize signing keystore from secrets
        env:
          KEYSTORE_B64: ${{ secrets.USBMEDIA_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p keystore
            printf "%s" "$KEYSTORE_B64" | base64 -d > keystore/ci.p12
            echo "USBMEDIA_KEYSTORE_PATH=$GITHUB_WORKSPACE/keystore/ci.p12" >> "$GITHUB_ENV"
            echo "SIGNING_SOURCE=github-secret" >> "$GITHUB_ENV"
            echo "Signing with the rotated key from repository secrets."
          else
            echo "::error::USBMEDIA_KEYSTORE_B64 is required for release builds."
            exit 1
          fi

      - name: Build debug APK
        id: build
        continue-on-error: true
        env:
          USBMEDIA_STORE_PASSWORD: ${{ secrets.USBMEDIA_STORE_PASSWORD }}
          USBMEDIA_KEY_ALIAS: ${{ secrets.USBMEDIA_KEY_ALIAS }}
          USBMEDIA_KEY_PASSWORD: ${{ secrets.USBMEDIA_KEY_PASSWORD }}
        run: |
          set +e
          ./gradlew :app:assembleDebug --no-daemon --console=plain --stacktrace 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit $code

      - name: Fail the run when the build failed
        if: steps.build.outcome == 'failure'
        run: |
          echo "::error::Debug build failed - see the workflow artifact for the compiler output."
          exit 1

      # continue-on-error حتى نستطيع نشر تقرير الفشل من داخل المستودع، وخطوة
      # "Fail the run when the tests failed" below تُفشل التشغيل فعليًا.
      # الاختبارات تسبق الآن رفع أي APK (تدقيق CI: لا يُنشر ناتج قبل اجتيازها).
      - name: Unit tests
        id: tests
        if: steps.build.outcome == 'success' && (github.event_name != 'workflow_dispatch' || inputs.run_tests)
        continue-on-error: true
        run: |
          set +e
          ./gradlew :app:testDebugUnitTest --no-daemon --console=plain --continue 2>&1 | tee tests.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit $code

      - name: Fail the run when the tests failed
        if: steps.tests.outcome == 'failure'
        run: |
          echo "::error::Unit tests failed - see the workflow artifact."
          exit 1

      # بوابة Lint: أي finding بخطورة Fatal يفشل التشغيل (تدقيق CI). الأخطاء الأقل خطورة
      # تبقى في التقرير دون إيقاف التسليم — تشديد البوابة تدريجيًا أفضل من تعطيله.
      - name: Android Lint (Fatal gate)
        if: steps.build.outcome == 'success'
        run: |
          set -o pipefail
          ./gradlew :app:lintDebug --no-daemon --console=plain 2>&1 | tee lint.log
          REPORT=app/build/reports/lint-results-debug.xml
          if [ ! -f "$REPORT" ]; then
            echo "::error::Lint XML report not found"
            exit 1
          fi
          if grep -q 'severity="Fatal"' "$REPORT"; then
            echo "::error::Android Lint reported Fatal-severity findings:"
            grep -o 'id="[^"]*"' "$REPORT" | sort -u | head -40
            exit 1
          fi
          echo "Lint gate passed: no Fatal findings."

      - name: Collect APKs
        if: steps.build.outcome == 'success'
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/USB-Media-Explorer-debug.apk
          ls -la dist

      # نسخة debug تبقى artifact للمطورين داخل سجل تشغيل Actions فقط؛ لم تعد تُنشر في
      # الـReleases العامة (تدقيق: التوقف عن توزيع نسخة قابلة للت debugging علنًا).
      - name: Upload debug APK (development artifact)
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.0
        with:
          name: USB-Media-Explorer-debug-apk
          path: dist/USB-Media-Explorer-debug.apk
          if-no-files-found: error
          retention-days: 30

      # نسخة release هي التسليم الأساسي (موقّعة ومصغّرة بـ R8)، لذا فشل بنائها يفشل
      # التشغيل وينشر الأخطاء في المستودع مثل نسخة debug تمامًا.
      - name: Build release APK (signed, R8)
        id: release_build
        if: steps.build.outcome == 'success'
        continue-on-error: true
        env:
          USBMEDIA_STORE_PASSWORD: ${{ secrets.USBMEDIA_STORE_PASSWORD }}
          USBMEDIA_KEY_ALIAS: ${{ secrets.USBMEDIA_KEY_ALIAS }}
          USBMEDIA_KEY_PASSWORD: ${{ secrets.USBMEDIA_KEY_PASSWORD }}
        run: |
          set +e
          ./gradlew :app:assembleRelease --no-daemon --console=plain --stacktrace 2>&1 | tee release.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit $code

      - name: Fail the run when the release build failed
        if: steps.release_build.outcome == 'failure'
        run: |
          echo "::error::Release build failed - see the workflow artifact for the compiler output."
          exit 1

      # المسار الصريح app-release.apk مع if-no-files-found=error يعني أن بناءً غير موقّع
      # (app-release-unsigned.apk) لا يمكن أن يتسرب إلى النشر أبدًا.
      - name: Upload release APK
        if: steps.release_build.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.0
        with:
          name: USB-Media-Explorer-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      # الأصول القديمة (غير الموقّعة، ونسخ debug المنشورة سابقًا) تُحذف من الـRelease حتى
      # يبقى ملف واحد موقّع هو التسليم الرسمي.
      - name: Remove legacy release assets
        if: steps.release_build.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete-asset apk-latest app-release-unsigned.apk --yes 2>/dev/null || true
          gh release delete-asset apk-latest USB-Media-Explorer-debug.apk --yes 2>/dev/null || true

      # ينشر الـAPK في Release ثابت اسمه apk-latest حتى يبقى رابط التنزيل واحدًا
      # ولا يحتاج المستخدم للدخول إلى سجل تشغيل Actions في كل مرة.
      - name: Publish APK to the apk-latest release
        if: steps.release_build.outcome == 'success'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.3.0
        with:
          tag_name: apk-latest
          name: 'أحدث نسخة APK جاهزة — USB Media Explorer'
          body: |
            ملف APK مبني تلقائيًا من آخر commit على هذا الفرع.

            - `app-release.apk` — **النسخة الموصى بها والوحيدة المنشورة**: موقّعة ومصغّرة
              بـ R8 (≈3.7MB بدل ≈23MB) — إقلاع أسرع وذاكرة أقل، وهي الأنسب للأجهزة منخفضة
              المواصفات.

            كل إصدار جديد يُثبَّت **فوق** الإصدار السابق مباشرة ويحافظ على بيانات المستخدم
            (المفضلة، المجلدات الأخيرة، مواضع التشغيل، كاش المصغرات).
            استثناء لمرة واحدة: بعد تدوير مفتاح التوقيع (SETUP_SIGNING.md) ستختلف البصمة،
            فيلزم إزالة تثبيت النسخة القديمة يدويًا قبل تثبيت أول نسخة بالمفتاح الجديد.

            نسخة debug لم تعد تُنشر هنا لأسباب أمنية؛ تبقى متاحة للمطورين كـartifact داخل
            سجل تشغيل Actions (تبويب Artifacts في آخر تشغيل ناجح).

            للتثبيت: انقل الملف إلى الهاتف ثم افتحه، وفعّل «التثبيت من مصادر غير معروفة» عند الطلب.
          files: app/build/outputs/apk/release/app-release.apk
          fail_on_unmatched_files: true

      - name: Publish GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v') && steps.release_build.outcome == 'success'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.3.0
        with:
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
