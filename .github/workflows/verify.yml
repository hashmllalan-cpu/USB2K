name: Verify

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v5.0.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.0
      - name: Verify wrapper
        run: ./gradlew --version
      - name: Unit tests
        id: unit_tests
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest --no-daemon --console=plain --stacktrace 2>&1 | tee unit-tests.log
      # Failure triage without opening the raw log: the error excerpt lands in the run
      # summary AND as a check annotation (visible via the Checks API). The job still
      # fails because the Unit tests step above failed.
      - name: Report unit-test failure cause
        if: failure() && steps.unit_tests.conclusion == 'failure'
        run: |
          python3 <<'EOF'
          import glob, os, re, xml.etree.ElementTree as ET

          lines = []
          if os.path.exists("unit-tests.log"):
              with open("unit-tests.log", errors="replace") as f:
                  log = f.read().splitlines()
              lines += [l.strip() for l in log if re.search(r"> Task .* FAILED", l)][:10]
              m = next((i for i, l in enumerate(log) if l.strip() == "What went wrong:"), None)
              if m is not None:
                  lines += ["What went wrong:"] + [l.strip() for l in log[m + 1:m + 9] if l.strip()]
              pat = re.compile(r"minCompileSdk|AAR metadata|Could not (resolve|find)|Dependency .* requires|error:|e: .*\.kt|FAILED")
              for l in log:
                  s = l.strip()
                  if pat.search(s) and s not in lines:
                      lines.append(s)
                      if len(lines) >= 30:
                          break
          failed_tests = []
          for path in glob.glob("app/build/test-results/testDebugUnitTest/*.xml"):
              try:
                  tree = ET.parse(path)
              except ET.ParseError:
                  continue
              for tc in tree.getroot().iter("testcase"):
                  node = tc.find("failure")
                  if node is None:
                      node = tc.find("error")
                  if node is not None:
                      msg = (node.get("message") or "")[:160]
                      failed_tests.append(f"{tc.get('classname')}.{tc.get('name')}: {msg}")
          lines += [f"FAILING TEST: {t}" for t in failed_tests[:15]]
          if not lines:
              lines = ["Unit tests step failed but no cause excerpt matched (see raw log)."]

          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a") as f:
                  f.write("### Unit-test failure excerpt\n```\n" + "\n".join(lines[:60]) + "\n```\n")

          def esc(s):
              return s.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")[:5000]

          print("::error::" + esc(" | ".join(lines[:12])))
          EOF
      - name: Lint
        run: ./gradlew :app:lintDebug --no-daemon --console=plain
      - name: Debug build
        run: ./gradlew :app:assembleDebug --no-daemon --console=plain

  instrumented-smoke:
    name: Instrumented smoke (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api-level: [29, 35]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v5.0.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.0

      - name: Run instrumented tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: ./gradlew :app:connectedDebugAndroidTest --no-daemon --console=plain
